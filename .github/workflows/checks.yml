name: Validate NORTHSTAR demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild deterministic demo data
        run: python scripts/build_demo_data.py
      - name: Validate the data contract
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
